# /etc/nginx/snippets/horizonecole-security.conf
#
# En-têtes de sécurité communs au site vitrine et à l'application.
#
# Pourquoi un fragment inclus plutôt que des directives au niveau serveur :
# nginx n'hérite les `add_header` d'un niveau supérieur QUE si le niveau courant
# n'en déclare aucun. Dès qu'un `location` pose son propre `add_header` (ici,
# pour le cache), il perd silencieusement tous ceux du serveur — le mot-clé
# `always` ne corrige pas ce comportement, contrairement à ce qu'on croit
# souvent. Ce fragment doit donc être inclus dans CHAQUE location qui déclare
# un add_header, en plus du niveau serveur.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
