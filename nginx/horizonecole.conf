# /etc/nginx/sites-available/horizonecole
# Copier ce fichier sur le VPS, puis :
#   ln -s /etc/nginx/sites-available/horizonecole /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name horizonecole.com www.horizonecole.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name horizonecole.com www.horizonecole.com;

    ssl_certificate /etc/letsencrypt/live/horizonecole.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizonecole.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Routes API, auth, fichiers uploadés et documentation
    location ~ ^/(api|auth|uploads|api-docs) {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Frontend SPA (React/Vite)
    root /var/www/horizonecole/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Headers de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
