# /etc/nginx/sites-available/horizonecole
# Copier ce fichier sur le VPS, puis :
#   ln -s /etc/nginx/sites-available/horizonecole /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────
# Répartition du domaine
#   /            → site vitrine statique (apps/site/dist)
#   /app/        → application SPA (React/Vite), connexion sur /app/login
#   /api /auth /uploads /api-docs → API Express (localhost:4001), inchangé
# ─────────────────────────────────────────────────────────────────────────────

# Redirections de compatibilité : toutes les URL de l'application d'avant la
# bascule sous /app/. Les favoris et liens partagés des utilisateurs pointent
# encore vers la racine ; ces redirections sont définitives, sans date de retrait.
# La liste des segments est extraite des <Route path="…"> de premier niveau de
# apps/web/src/App.tsx. Toute nouvelle section applicative doit y être ajoutée.
map $uri $legacy_app_uri {
    default "";

    "~^/(academic|classes|creer-etablissement|dashboard|etablissement|evaluations|finance|login|parent|people|primary|student|students|subjects|teacher)(/.*)?$"  /app$uri;

    # Écrans de prévisualisation du design system (hors production, conservés
    # pour ne pas casser les liens de recette).
    "~^/(design-system-preview|ds|ds-attendance|ds-dashboard|ds-entity|ds-grades|ds-inscriptions|ds-nav|ds-relational|ds-students|ds-timetable)(/.*)?$"  /app$uri;
}

server {
    listen 80;
    server_name horizonecole.com www.horizonecole.com;
    return 301 https://horizonecole.com$request_uri;
}

# Canonicalisation : une seule origine indexable, sans « www ».
server {
    listen 443 ssl http2;
    server_name www.horizonecole.com;

    ssl_certificate /etc/letsencrypt/live/horizonecole.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizonecole.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://horizonecole.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name horizonecole.com;

    ssl_certificate /etc/letsencrypt/live/horizonecole.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/horizonecole.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # ── 1. Redirections des anciennes URL applicatives ──────────────────────
    # Placé avant tout le reste : ces chemins ne doivent jamais atteindre le
    # site vitrine. Ne s'applique qu'aux URI cartographiées ci-dessus.
    if ($legacy_app_uri != "") {
        return 301 $legacy_app_uri;
    }

    # ── 2. API, authentification, fichiers téléversés, documentation ────────
    # Bloc en expression régulière : il prime sur les préfixes qui suivent.
    # Inchangé par la bascule — l'API reste servie à la racine du domaine.
    location ~ ^/(api|auth|uploads|api-docs) {
        proxy_pass http://localhost:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # ── 3. Application SPA sous /app/ ───────────────────────────────────────

    # Ressources produites par Vite : noms hachés, donc immuables.
    location /app/assets/ {
        alias /var/www/horizonecole/apps/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/horizonecole-security.conf;
        access_log off;
    }

    location /app/ {
        alias /var/www/horizonecole/apps/web/dist/;
        # Repli sur index.html : le routage est côté client, un rafraîchissement
        # sur une page profonde ne doit pas produire de 404.
        try_files $uri $uri/ /app/index.html;
        # index.html porte les références aux bundles hachés : le mettre en
        # cache figerait les utilisateurs sur une version périmée.
        add_header Cache-Control "no-cache" always;
        include snippets/horizonecole-security.conf;
    }

    location = /app {
        return 301 /app/;
    }

    # ── 4. Redirections des sous-pages consolidées en ancres ────────────────
    #
    # Le périmètre fonctionnel et les trois cycles, jadis éclatés en onze
    # sous-pages, tiennent chacun sur une page unique. Astro produit bien une
    # page de redirection par méta-rafraîchissement pour chacune de ces URL,
    # mais elle répond en 200 : un moteur la traite comme une redirection molle
    # et conserve l'ancienne adresse. Ces règles rendent la 301 explicite, et
    # doivent précéder le « location / » qui servirait sinon le fichier HTML.
    location ~ ^/fonctionnalites/(proprietaire|administration|enseignants|eleves-parents|scolarite-finances|bulletins-notes|presences-vie-scolaire|paie-personnel)$ {
        return 301 /fonctionnalites#$1;
    }

    location ~ ^/cycles/(primaire|college|lycee)$ {
        return 301 /cycles#$1;
    }

    # ── 5. Site vitrine, à la racine du domaine ─────────────────────────────
    #
    # Fichiers statiques produits par « pnpm run build:site », servis depuis le
    # dépôt lui-même — comme apps/web/dist, et sans étape de copie.
    root /var/www/horizonecole/apps/site/dist;
    index index.html;

    location / {
        # Astro produit /tarifs.html et non /tarifs/index.html (build.format
        # « file ») : d'où la tentative sur $uri.html avant le répertoire.
        try_files $uri $uri.html $uri/index.html =404;

        # Le cache des pages est réglé ici et non dans un location ~ \.html$ :
        # try_files sert le fichier trouvé sans relancer la sélection de
        # location, si bien qu'une règle sur l'extension ne s'appliquerait
        # jamais aux URL sans extension (/tarifs servi depuis tarifs.html).
        add_header Cache-Control "public, max-age=300" always;
        include snippets/horizonecole-security.conf;
    }

    # La page d'erreur doit être servie AVEC un statut 404 : la placer en repli
    # de try_files la renverrait en 200, et les moteurs indexeraient des pages
    # inexistantes comme si elles étaient valides.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Ressources hachées par Astro : immuables.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/horizonecole-security.conf;
        access_log off;
    }

    # Polices auto-hébergées : leur nom ne change pas, mais leur contenu non plus.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/horizonecole-security.conf;
        access_log off;
    }

    # ── 6. Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml text/javascript image/svg+xml;

    # ── 7. En-têtes de sécurité ─────────────────────────────────────────────
    # Déportés dans un fragment car nginx n'hérite les `add_header` que si le
    # niveau courant n'en déclare aucun : chaque location qui règle le cache
    # doit donc réinclure ce fichier, sans quoi elle perdrait ces en-têtes.
    # Installation : copier nginx/security-headers.conf vers
    #   /etc/nginx/snippets/horizonecole-security.conf
    include snippets/horizonecole-security.conf;
}
